apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: config-app
  name: config-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-app
  strategy: {}
  template:
    metadata:
      labels:
        app: config-app
    spec:
      containers:
      - image: redis:latest
        name: redis
        env:
          - name: APP_ENV
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: APP_ENV
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: password