apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ecomerce-route
  namespace: ecomerce
spec:
  parentRefs:
  - name: ecommerce-gateway
  hostnames:
  - "shop.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: ecommerce-api
      port: 8080

