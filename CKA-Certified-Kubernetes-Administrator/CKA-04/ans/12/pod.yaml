apiVersion: v1
kind: Pod
metadata:
  name: storage-client
  namespace: dp
spec:
  containers:
    - name: fc-container
      image: fedora:26
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      command: ["/bin/sh", "-c"]
      args: [ "echo 11 >> /var/lib/app/test.txt && sleep 3600" ]
      volumeMounts:
      - mountPath: "/var/lib/app"
        name: data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: app-data
