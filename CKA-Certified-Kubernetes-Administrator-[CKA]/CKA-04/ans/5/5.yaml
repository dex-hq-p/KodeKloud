apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: database
  labels:
    app: redis
spec:
  ports:
  - port: 6379
    name: redis
  clusterIP: None
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: database
spec:
  selector:
    matchLabels:
      app: redis 
  serviceName: "redis-headless"
  replicas: 3
  template:
    metadata:
      labels:
        app: redis
    spec: 
      containers:
      - name: redis
        image: redis:7.4
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: www
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
