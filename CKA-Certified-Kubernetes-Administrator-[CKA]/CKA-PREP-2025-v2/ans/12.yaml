apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-ingress
  namespace: echo-sound
spec:
  ingressClassName: default
  rules:
  - host: example.org
    http:
      paths:
      - backend:
          service:
            name: echo-service
            port:
              number: 8080
        path: /echo
        pathType: Exact
status:
  loadBalancer: {}
