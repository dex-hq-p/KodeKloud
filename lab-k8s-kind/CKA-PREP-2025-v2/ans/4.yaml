apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "2"
  name: wordpress
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: wordpress
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
      - command:
        - sh
        - -c
        - echo 'Starting WordPress...' && sleep 3600
        resources:
          requests:
            memory: "1500Mi"
            cpu: "1500m"
          limits:
            memory: "1500Mi"
            cpu: "1500m"
        image: busybox:latest
        imagePullPolicy: Always
        name: wordpress
        ports:
        - containerPort: 80
          protocol: TCP
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/log
          name: data
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - echo 'Preparing environment...' && sleep 5
        image: busybox
        imagePullPolicy: Always
        name: init-setup
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        resources:
          requests:
            memory: "1500Mi"
            cpu: "1500m"
          limits:
            memory: "1500Mi"
            cpu: "1500m"
      - command:
        - sh
        - -c
        - 'touch /var/log/wordpress.log && tail -f -n 10 /var/log/wordpress.log '
        resources:
          requests:
            memory: "1500Mi"
            cpu: "1500m"
          limits:
            memory: "1500Mi"
            cpu: "1500m"
        image: busybox:latest
        imagePullPolicy: Always
        name: logshipper
        restartPolicy: Always
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/log
          name: data
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: data
status:
  conditions:
  - lastTransitionTime: "2026-11-24T08:05:44Z"
    lastUpdateTime: "2026-11-24T08:05:44Z"
    message: Deployment has minimum availability.
    reason: MinimumReplicasAvailable
    status: "True"
    type: Available
  - lastTransitionTime: "2026-11-24T07:52:52Z"
    lastUpdateTime: "2026-11-24T08:06:27Z"
    message: ReplicaSet "wordpress-6c58bd7cc9" has successfully progressed.
    reason: NewReplicaSetAvailable
    status: "True"
    type: Progressing
  observedGeneration: 3
  terminatingReplicas: 0
