apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - while true; do echo 'WordPress is running...' >> /var/log/wordpress.log;
          sleep 5; done
        image: busybox:latest
        name: wordpress
        ports:
        - containerPort: 80
          protocol: TCP
        volumeMounts: 
          - name: data
            mountPath: /var/log
      initContainers:
        - name: logshipper
          image: busybox:latest
          restartPolicy: Always
          command: ['sh', '-c', 'touch /var/log/wordpress.log && tail -f -n 10 /var/log/wordpress.log ']
          volumeMounts:
            - name: data
              mountPath: /var/log
      volumes:
        - name: data
          emptyDir: {}
